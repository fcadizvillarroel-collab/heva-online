name: HEVA Laboratorio CI
on:
  push:
    branches: [experimental/heva-lab-strategy-bridge]
  pull_request:
    branches: [experimental/estrategias-pedagogicas]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Validar sintaxis
        run: |
          node --check api/generate.js
          node --check lib/lab-strategy.cjs
          node --check experimental/strategy-lab.js
          node --check experimental/integration.js
      - name: Pruebas nuevas del puente EPJA
        run: node --test tests/lab-strategy.test.cjs
      - name: Pruebas globales HEVA
        run: npm test
      - name: Prueba visual del Laboratorio en Chrome
        run: node --test tests/lab-browser.test.cjs
        env:
          HEVA_QA_ARTIFACT_DIR: ${{ runner.temp }}/heva-lab-visual
      - name: Guardar captura y evidencia
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heva-lab-visual
          path: ${{ runner.temp }}/heva-lab-visual/
          if-no-files-found: warn
