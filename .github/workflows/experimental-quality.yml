name: HEVA compatibility and quality checks
on:
  push:
    branches:
      - experimental/estrategias-pedagogicas
      - integration/**
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install HEVA dependencies
        run: npm ci
      - name: Run HEVA regression tests
        run: npm test
      - name: Run experimental quality tests
        run: node --test tests/experimental-quality.cjs experimental/integration.test.cjs experimental/strategy-lab.test.cjs
