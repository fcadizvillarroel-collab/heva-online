name: HEVA quality and export checks
on:
  push:
    branches:
      - 'work/prioridades-1-7-20261118'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate JavaScript syntax
        run: |
          node --check heva-office.js
          node --check heva-slide-design.js
          node --check heva-guide-visuals.js
          node --check heva-assessment.js
      - name: Run regression tests
        run: npm test
      - name: Install Chromium smoke test tooling
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Export real DOCX and PPTX in Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/heva-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node scripts/export-browser-smoke.cjs
      - name: Comprobar organización visual de la guía en Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/heva-ui-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node scripts/result-layout-browser-smoke.cjs
          node qa/ui-check.cjs
        env:
          HEVA_RESULT_QA_DIR: ${{ runner.temp }}/heva-result-qa
      - name: Inspección visual real HEVA LAB en Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/heva-lab-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node scripts/lab-visual-browser-smoke.cjs
        env:
          HEVA_RESULT_QA_DIR: ${{ runner.temp }}/heva-result-qa
      - name: Verificar PPTX de 16 diapositivas y guía Word de muestra
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/heva-office-extended.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node scripts/lab-full-office-smoke.cjs
        env:
          HEVA_RESULT_QA_DIR: ${{ runner.temp }}/heva-result-qa
      - name: Validar HEVA LAB unificado en principal con Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/heva-unified-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node scripts/lab-unified-main-browser-smoke.cjs
      - name: Auditar visual y controles repetidos en cuatro anchos
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/heva-main-visual-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node scripts/heva-main-visual-audit.cjs
        env:
          HEVA_VISUAL_AUDIT_DIR: ${{ runner.temp }}/heva-visual-qa
      - name: Conservar capturas del generador unificado
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heva-auditoria-visual-responsive
          path: ${{ runner.temp }}/heva-visual-qa/
          if-no-files-found: warn
      - name: Comprobar cuatro pasos dentro de HEVA en móvil y escritorio
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/heva-steps-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node scripts/heva-steps-browser-smoke.cjs
        env:
          HEVA_STEPS_QA_DIR: ${{ runner.temp }}/heva-pasos-qa
      - name: Guardar capturas de los pasos 1 al 4
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heva-pasos-1-4-visual
          path: ${{ runner.temp }}/heva-pasos-qa/
          if-no-files-found: warn
      - name: Validar acordeones y coherencia del paso 2 en HEVA de prueba
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/heva-acordeones.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node scripts/heva-accordion-browser-smoke.cjs
        env:
          HEVA_ACCORDIONS_QA_DIR: ${{ runner.temp }}/heva-acordeones-qa
      - name: Conservar capturas de la versión desplegable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heva-lab-acordeones-pasos
          path: ${{ runner.temp }}/heva-acordeones-qa/
          if-no-files-found: warn
      - name: Conservar captura de revisión visual
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heva-visor-guia-reordenado
          path: ${{ runner.temp }}/heva-result-qa/
          if-no-files-found: warn
