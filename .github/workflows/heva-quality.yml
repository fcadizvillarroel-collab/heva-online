name: HEVA quality and export checks
on:
  push:
    branches:
      - 'work/prioridades-1-7-20261118'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate JavaScript syntax
        run: |
          node --check heva-office.js
          node --check heva-slide-design.js
          node --check heva-guide-visuals.js
          node --check heva-assessment.js
      - name: Run regression tests
        run: npm test
