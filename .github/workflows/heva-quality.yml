name: HEVA quality and export checks
on:
  push:
    branches:
      - 'work/prioridades-1-7-20261118'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate JavaScript syntax
        run: |
          node --check heva-office.js
          node --check heva-slide-design.js
          node --check heva-guide-visuals.js
          node --check heva-assessment.js
      - name: Run regression tests
        run: npm test
      - name: Install Chromium smoke test tooling
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Export real DOCX and PPTX in Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/heva-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node scripts/export-browser-smoke.cjs
      - name: Comprobar organización visual de la guía en Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/heva-ui-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node scripts/result-layout-browser-smoke.cjs
        env:
          HEVA_RESULT_QA_DIR: ${{ runner.temp }}/heva-result-qa
      - name: Inspección visual real HEVA LAB en Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/heva-lab-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node scripts/lab-visual-browser-smoke.cjs
        env:
          HEVA_RESULT_QA_DIR: ${{ runner.temp }}/heva-result-qa
      - name: Verificar PPTX de 16 diapositivas y guía Word de muestra
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/heva-office-extended.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node scripts/lab-full-office-smoke.cjs
        env:
          HEVA_RESULT_QA_DIR: ${{ runner.temp }}/heva-result-qa
      - name: Verify real preview API, OA and generation with 2 integrated strategies
        env:
          PREVIEW_BASE: https://heva-online-1pml9u72w-fcadizvillarroel-5814.vercel.app
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          (async()=>{
            const base=process.env.PREVIEW_BASE;
            const statusResp=await fetch(base+'/api/status',{signal:AbortSignal.timeout(20000)});
            assert.equal(statusResp.status,200,'Preview /api/status must be HTTP 200 (not protected login)');
            const diag=await statusResp.json();
            for(const name of ['gemini','groq'])assert.equal(diag.proveedores?.[name]?.configurado,true,name+' not configured');
            const catalog=require('./catalogo-publicado.json');
            const oa=catalog.find(x=>x.clave_interna==='D257|MED|Estudios Sociales|N2|7');
            assert.ok(oa&&oa.estado==='APROBADO'&&oa.referencia_comprobada);
            const Integration=require('./experimental/integration.js');
            const integrated=Integration.plan({
              strategies:[{id:'casos',quantity:1},{id:'multicausalidad',quantity:1}],
              counts:{alternativas:2,desarrollo:0,lecturas:1},mode:'manual',
              manual:{'casos-1':{alternativas:1,desarrollo:0,lecturas:1},
                'multicausalidad-1':{alternativas:1,desarrollo:0,lecturas:0}}
            });
            assert.ok(Integration.validate(integrated).ok);
            const body={
              asignatura:oa.asignatura,nivel:oa.nivel,marcoCurricular:oa.marco,
              objetivoAprendizaje:oa.texto_literal,
              temaEspecifico:'Globalización: decisiones económicas y culturales de adultos',
              tipoMaterial:'EVALUACION',estrategiaDidactica:'CASOS',
              cantAlternativas:2,cantDesarrollo:0,cantCasos:1,
              planIntegrado:integrated,modoReferencia:'NINGUNA',adecuacionesPIE:[],
              instruccionesDocente:'Prueba breve para EPJA, sin información personal, dos situaciones diferentes, pauta únicamente docente.'
            };
            const reply=await fetch(base+'/api/generate',{
              method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify(body),signal:AbortSignal.timeout(90000)});
            let json;try{json=await reply.json()}catch{throw Error('Preview API returned non-JSON; HTTP '+reply.status)}
            const material=json.material||{};
            const tracer=(material.trazabilidadEstrategia||[]).filter(x=>['CASO-1','ALT-1','ALT-2'].includes(x.referencia));
            console.log('Preview real generation (no material details):',JSON.stringify({
              http:reply.status,exito:json.exito===true,
              nAlternativas:material.preguntasAlternativas?.length||0,
              nCasos:material.casosEstudio?.length||0,
              nDesarrollo:material.preguntasDesarrollo?.length||0,
              refs:tracer.map(x=>({ref:x.referencia,ids:x.estrategiasIntegradas||[]})),
              labAudit:Boolean(json.revision?.laboratorioVista),
              error:String(json.error||'').slice(0,200)
            }));
            assert.equal(reply.status,200);
            assert.equal(json.exito,true);
            assert.equal(material.objetivoAprendizaje,body.objetivoAprendizaje);
            assert.equal(material.preguntasAlternativas?.length,2);
            assert.equal(material.preguntasDesarrollo?.length,0);
            assert.equal(material.casosEstudio?.length,1);
            assert.ok(json.revision?.laboratorioVista,'New preview LAB audit not returned');
            const links=new Map(tracer.map(t=>[t.referencia,t.estrategiasIntegradas||[]]));
            assert.ok(links.get('ALT-1')?.includes('casos-1'));
            assert.ok(links.get('CASO-1')?.includes('casos-1'));
            assert.ok(links.get('ALT-2')?.includes('multicausalidad-1'));
            const q=material.preguntasAlternativas;
            for(const item of q){
              assert.deepEqual(item.alternativas.map(x=>x.letra),['A','B','C','D']);
              assert.ok(['A','B','C','D'].includes(item.claveCorrecta));
            }
            fs.writeFileSync('/tmp/heva-preview-material.json',JSON.stringify(material));
            console.log('PASS: live preview API + official EPJA OA + 2 strategies + traceability + audit.');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Export actual AI result to DOCX and PPTX in Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/heva-preview-export-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright'),fs=require('node:fs/promises'),path=require('node:path'),
            os=require('node:os'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          (async()=>{
            const material=JSON.parse(await fs.readFile('/tmp/heva-preview-material.json','utf8'));
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({acceptDownloads:true});
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(()=>Boolean(window.HEVAOffice&&window.docx&&window.PptxGenJS),{timeout:30000});
              const dir=await fs.mkdtemp(path.join(os.tmpdir(),'heva-live-preview-'));
              for(const [name,method,ext,checkFile] of [
                ['Word','word','.docx','word/document.xml'],
                ['PowerPoint','powerpoint','.pptx','ppt/presentation.xml']
              ]){
                const pending=page.waitForEvent('download',{timeout:60000});
                await page.evaluate(async({material,method})=>await window.HEVAOffice[method](material,false),{material,method});
                const downloaded=await pending;
                assert.ok(downloaded.suggestedFilename().endsWith(ext));
                const file=path.join(dir,name+ext);
                await downloaded.saveAs(file);
                const bytes=await fs.readFile(file);
                assert.ok(bytes.length>2500);
                assert.equal(bytes.subarray(0,4).toString('hex'),'504b0304');
                const xml=execFileSync('unzip',['-p',file,checkFile],{encoding:'utf8'});
                assert.ok(xml.length>100);
                if(name==='Word'){
                  assert.ok(xml.includes('Selección múltiple'),'Word exam lost alternatives');
                  assert.ok(!xml.includes('PAUTA DOCENTE · USO EXCLUSIVO'),'Student export exposed teacher key');
                }
                console.log('PASS: '+name+' AI-generated preview export as '+ext+' ('+bytes.length+' bytes)');
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Conservar captura de revisión visual
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heva-visor-guia-reordenado
          path: ${{ runner.temp }}/heva-result-qa/
          if-no-files-found: warn
