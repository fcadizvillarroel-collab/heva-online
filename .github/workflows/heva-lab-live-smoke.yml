name: HEVA LAB - prueba real de generación en Preview
on:
  push:
    branches: [integration/lab-final-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Generar una guía EPJA con el proveedor disponible
        env:
          URL: https://heva-online-jnzwiwosz-fcadizvillarroel-5814.vercel.app/api/generate
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const catalog=require('./catalogo-publicado.json');
          const oa=catalog.find(x=>x.clave_interna==='D257|MED|Estudios Sociales|N2|7');
          if(!oa)throw Error('OA no publicado');
          fs.writeFileSync('/tmp/lab-payload.json',JSON.stringify({
            asignatura:oa.asignatura,nivel:oa.nivel,marcoCurricular:oa.marco,
            objetivoAprendizaje:oa.texto_literal,oaClaveLaboratorio:oa.clave_interna,
            temaEspecifico:'Dimensiones económicas y culturales de la globalización',
            estrategiaLaboratorio:'casos',tipoMaterial:'GUIA',
            cantAlternativas:1,cantDesarrollo:0,cantCasos:1
          }));
          NODE
          HTTP=$(curl --silent --show-error --max-time 65 -o /tmp/lab-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data-binary @/tmp/lab-payload.json "$URL") || HTTP=000
          echo "HEVA LAB preview HTTP status: $HTTP"
          HTTP="$HTTP" node - <<'NODE'
          const fs=require('node:fs');
          const http=process.env.HTTP;
          let b={};try{b=JSON.parse(fs.readFileSync('/tmp/lab-response.json','utf8'))}catch{}
          const result={http,exito:b.exito===true,provider:b.material?.autor?.proveedor||null,
            title:b.material?.titulo||null,questions:b.material?.preguntasAlternativas?.length||0,
            cases:b.material?.casosEstudio?.length||0,lab:b.revision?.laboratorio?.map(x=>x.estado)||[],
            error:b.error||null,code:b.codigo||null};
          console.log('Resultado redacted:',JSON.stringify(result));
          if(http==='401'||http==='403'){console.log('Bloqueo por autenticación de Preview; no se afirma generación real.');process.exit(0)}
          if(http!=='200'||!b.exito||!b.material)process.exit(1);
          const oa=require('./catalogo-publicado.json').find(x=>x.clave_interna==='D257|MED|Estudios Sociales|N2|7');
          if(b.material.objetivoAprendizaje!==oa.texto_literal)throw Error('OA alterado');
          if(!Array.isArray(b.material.preguntasAlternativas)||b.material.preguntasAlternativas.length!==1)throw Error('Preguntas inconsistentes');
          if(!Array.isArray(b.material.casosEstudio)||b.material.casosEstudio.length!==1)throw Error('Casos inconsistentes');
          if(!b.revision?.laboratorio?.length)throw Error('Auditoría Laboratorio ausente');
          console.log('GENERACIÓN REAL VALIDADA (estructura y OA). Revisión disciplinar docente pendiente.');
          NODE
