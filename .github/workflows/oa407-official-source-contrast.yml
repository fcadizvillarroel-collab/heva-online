name: HEVA 407 OA official PDF source contrast
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_407_official_pdfs.py'
      - 'scripts/test_407_official_pdf_candidates.py'
      - '.github/workflows/oa407-official-source-contrast.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF text parser
        run: python -m pip install pypdf==5.9.0 'cryptography>=42,<47' 'pymupdf>=1.25,<1.27'
      - name: Test candidate-page hints are not certified matches
        run: python scripts/test_407_official_pdf_candidates.py
      - name: Compare every OA against downloaded original official PDFs
        run: python scripts/verify_407_official_pdfs.py out/contraste_fuentes
      - name: Summarize literal PDF evidence without claiming expert validation
        if: always()
        run: |
          if test -f out/contraste_fuentes/resumen_contraste_fuentes.json; then
            python -c "import json;d=json.load(open('out/contraste_fuentes/resumen_contraste_fuentes.json'));print('Original PDFs:',len(d['fuentes']),'of 2; literal OA:',d['coincidencia_literal_pdf'],'cross-page:',d['coincidencia_entre_paginas'],'not located:',d['no_localizados_en_texto_extraido'],'with unverified candidate page:',d['no_localizados_con_pagina_candidata'],'PDF missing:',d['pdf_no_disponible'])" >> "$GITHUB_STEP_SUMMARY"
            python -c "import json;d=json.load(open('out/contraste_fuentes/resumen_contraste_fuentes.json'));assert len(d['fuentes'])==2,'Both official PDFs must be available before considering source coverage checked'"
          fi
      - name: Preserve individual matches and original PDF checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heva-407-oa-original-mineduc-pdf-source-contrast
          path: out/contraste_fuentes/*
          retention-days: 30
