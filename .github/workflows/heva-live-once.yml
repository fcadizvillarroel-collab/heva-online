name: HEVA diagnóstico único producción e IA
on:
  push:
    branches:
      - qa/heva-e2e-unico-20261124
permissions:
  contents: read
jobs:
  ensayo:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Descargar código de la rama de diagnóstico
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Probar estado de proveedores y una única generación EPJA
        run: node tests/heva-live-once.cjs
      - name: Conservar evidencia de diagnóstico y respuesta
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heva-ensayo-real-unico-20261124
          path: qa-live/
          retention-days: 7
          if-no-files-found: warn
