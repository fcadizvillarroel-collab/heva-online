name: HEVA individual 407 OA pedagogical evidence audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_stage2_pedagogy.py'
      - 'scripts/oa_lessons.py'
      - 'catalogo-publicado.json'
      - '.github/workflows/epja-pedagogical-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run individual curriculum evidence audit
        run: python scripts/audit_stage2_pedagogy.py out/etapa2_revision
      - name: Upload 407 individual pedagogical review records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heva-407-oa-individual-pedagogical-evidence
          path: out/etapa2_revision/
          retention-days: 30
